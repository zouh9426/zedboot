name: skill-spec

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # skills-ref 为 agentskills.io 官方参考校验器；PyPI 版 CLI 名有打包问题，
        # 从 git 子目录安装并钉死 commit（上游 main 是移动目标，防供应链漂移）
      - name: Install skills-ref (pinned)
        run: pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate SKILL.md against Agent Skills spec
        run: skills-ref validate ./zedboot
